plugins {
	id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
	id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

base.archivesName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
	mavenLocal()
	mavenCentral()
	maven {
		name "SquidDev"
		url "https://squiddev.cc/maven"
	}
	maven { url 'https://jitpack.io' }
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases" }
	maven { url "https://maven.pitan76.net/" }
	maven { url "https://cursemaven.com" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation 'RebornCore:RebornCore-26.2:6.1.0'
    implementation 'TechReborn:TechReborn-26.2:6.1.1'

	//modImplementation "me.shedaniel:RoughlyEnoughItems-fabric:16.0.754"

	//modApi "me.shedaniel:RoughlyEnoughItems-api-fabric:20.0.9999"
	//modApi "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:20.0.9999"
	api "teamreborn:energy:5.0.0"

	// CC: Tweaked
	//modImplementation("cc.tweaked:cc-tweaked-1.21-fabric-api:${project.cc_version}")
	//modApi("cc.tweaked:cc-tweaked-1.21-fabric:${project.cc_version}")

	// Mod Menu
	//modApi "com.terraformersmc:modmenu:2.0.10"

	// Cloth Config API
	api("me.shedaniel.cloth:cloth-config-fabric:26.2.155") {
		exclude(group: "net.fabricmc.fabric-api")
	}

    implementation("net.pitan76:mcpitanlib-fabric${rootProject.mcpitanlib_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }

    withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			artifact(jar) {
				builtBy jar
			}
			artifact(sourcesJar) {
				builtBy sourcesJar
			}
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

publishMods {
    file = jar.archiveFile
    version = project.mod_version
    displayName = jar.archiveFileName
    changelog = rootProject.changelog + "\nMCPitanLib version: " + mcpitanlib_version.split(":")[1]

    type = STABLE
    modLoaders.add("fabric")

    var curseforgeToken = providers.environmentVariable("CURSEFORGE_TOKEN")
    var modrinthToken = providers.environmentVariable("MODRINTH_TOKEN")

    if (curseforgeToken.isPresent()) {
        curseforge {
            accessToken = curseforgeToken
            projectId = "543089"
            minecraftVersions.addAll(['26.2'])
            client = true
            server = true
            requires("fabric-api")
            requires("techreborn")
            requires("reborncore")
            requires("mcpitanlibarch")
            optional("roughly-enough-items")
            // optional("cc-tweaked")
        }
    }

    if (modrinthToken.isPresent()) {
        modrinth {
            accessToken = modrinthToken
            projectId = "ir8okcEA"
            minecraftVersions.addAll(['26.2'])
            requires("fabric-api")
            requires("mcpitanlibarch")
            requires("techreborn")
            requires("reborncore")
            optional("rei")
            // optional("cc-tweaked")
        }
    }
}